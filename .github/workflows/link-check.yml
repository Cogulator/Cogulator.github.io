name: Link checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  external-url-schemes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check external URL schemes
        run: node .github/scripts/check-external-urls.js
